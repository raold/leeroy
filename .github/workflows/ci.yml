name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck --severity=warning --external-sources --source-path=scripts scripts/*.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  leeroy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install boost
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: build and run unit tests
        run: |
          cmake -S modules/mod-leeroy/tests -B t -DCMAKE_BUILD_TYPE=Release
          cmake --build t -j "$(nproc)"
          ./t/leeroy_tests
