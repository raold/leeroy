name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck --severity=warning --external-sources --source-path=scripts scripts/*.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  leeroy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install boost
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: build and run unit tests
        run: |
          cmake -S modules/mod-leeroy/tests -B t -DCMAKE_BUILD_TYPE=Release
          cmake --build t -j "$(nproc)"
          ./t/leeroy_tests
      - name: bridge smoke tool parses
        run: python3 -m py_compile modules/mod-leeroy/tools/bridge_smoke.py

  mind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mind
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: libatomic for pedalboard
        run: sudo apt-get update && sudo apt-get install -y libatomic1
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
