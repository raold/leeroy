name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The native unit tests need only header-only boost.asio: take the headers from boost's own
# GitHub release (the version the live build uses) rather than the runner's apt mirror.
env:
  BOOST_URL: https://github.com/boostorg/boost/releases/download/boost-1.92.0/boost-1.92.0-b2-nodocs.tar.xz
  BOOST_SHA256: ea7b982002cc9dfbe59b0b217b206f470dc75f3de0bb2973d844118934d82411

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck --severity=warning --external-sources --source-path=scripts scripts/*.sh scripts/tests/*.sh
      - name: config key report self-test
        run: bash scripts/tests/ac-update-keys.sh
      - name: guild backup self-test (synthetic data only)
        run: bash scripts/tests/ac-guild-backup.sh
      - name: guild backup schedule self-test (no task registration)
        run: pwsh -NoProfile -File scripts/tests/ac-guild-backup-schedule.ps1
      - name: release self-test (temporary repositories and stub services)
        run: bash scripts/tests/ac-release.sh
      - name: SOAP client self-test (fake server on loopback)
        run: bash scripts/tests/ac-soap.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  leeroy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: install boost headers
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/boost.tar.xz" "$BOOST_URL"
          echo "$BOOST_SHA256  $RUNNER_TEMP/boost.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/boost.tar.xz" -C "$RUNNER_TEMP" boost-1.92.0/boost
      - name: build and run unit tests
        run: |
          cmake -S modules/mod-leeroy/tests -B t -DCMAKE_BUILD_TYPE=Release -DLEEROY_BOOST_INCLUDE_DIR="$RUNNER_TEMP/boost-1.92.0"
          cmake --build t -j "$(nproc)"
          ./t/leeroy_tests
      - name: bridge smoke tool parses
        run: python3 -m py_compile modules/mod-leeroy/tools/bridge_smoke.py

  mind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mind
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -n auto tests

  console-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mind
    env:
      LEEROY_CONSOLE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            mind/pyproject.toml
            mind/tests/console/e2e/requirements.txt
      - run: python -m pip install -e ".[test]" -r tests/console/e2e/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-console-chromium-${{ hashFiles('mind/tests/console/e2e/requirements.txt') }}
      # The image already carries Chrome's libraries; a failed apt mirror only costs --with-deps.
      - run: python -m playwright install --with-deps chromium || python -m playwright install chromium
      - run: npm ci --prefix tests/console/e2e --ignore-scripts --no-audit --no-fund
      - run: python -m pytest tests/console/e2e -v -o faulthandler_timeout=90 --basetemp "$RUNNER_TEMP/console-e2e" --junitxml "$RUNNER_TEMP/console-e2e-results.xml"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-e2e-failures
          path: |
            ${{ runner.temp }}/console-e2e/**/failure.png
            ${{ runner.temp }}/console-e2e/**/failure.html
            ${{ runner.temp }}/console-e2e/**/axe-*.json
            ${{ runner.temp }}/console-e2e-results.xml
          retention-days: 7

  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: libatomic for pedalboard
        run: sudo apt-get update && sudo apt-get install -y libatomic1
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  selfie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: selfie
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  dojo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install boost headers
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/boost.tar.xz" "$BOOST_URL"
          echo "$BOOST_SHA256  $RUNNER_TEMP/boost.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/boost.tar.xz" -C "$RUNNER_TEMP" boost-1.92.0/boost
      - name: build and run the pure mod-dojo tests
        run: |
          cmake -S modules/mod-dojo/tests -B t -DCMAKE_BUILD_TYPE=Release -DDOJO_WARNINGS_AS_ERRORS=ON -DDOJO_BOOST_INCLUDE_DIR="$RUNNER_TEMP/boost-1.92.0"
          cmake --build t -j "$(nproc)"
          ./t/dojo_tests
      - name: golden fixture generator parses
        run: python3 -m py_compile modules/mod-dojo/tests/fixtures/make_dojo_protocol.py

  dojo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dojo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      # The preflight tests link directories with symlinks here; their junction paths only run on Windows.
      - run: python -m pytest -q
      - name: fake worker protocol smoke
        run: python -m leeroy_dojo protocol-smoke --fake --out "$RUNNER_TEMP/dojo-smoke"

  voice-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: libatomic for pedalboard
        run: sudo apt-get update && sudo apt-get install -y libatomic1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: mind test environment
        run: |
          python -m venv "$RUNNER_TEMP/mind-venv"
          "$RUNNER_TEMP/mind-venv/bin/python" -m pip install -e "./mind[test]"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: voice test environment
        run: |
          python -m venv "$RUNNER_TEMP/voice-venv"
          "$RUNNER_TEMP/voice-venv/bin/python" -m pip install -e "./voice[test]"
      - name: headless cross-service regression
        run: |
          "$RUNNER_TEMP/mind-venv/bin/python" -B voice/tools/rehearsal/run_rehearsal.py \
            --worktree "$GITHUB_WORKSPACE" \
            --mind-python "$RUNNER_TEMP/mind-venv/bin/python" \
            --voice-python "$RUNNER_TEMP/voice-venv/bin/python" \
            --out "$RUNNER_TEMP/voice-rehearsal"
      - name: rehearsal results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "voice-rehearsal"
          for path in sorted(root.glob("*/*")):
              if path.name == "summary.json" or path.name.endswith("-pytest.log"):
                  print(path.name)
                  print(path.read_text(encoding="utf-8"))
          PY
