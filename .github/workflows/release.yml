name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Package
        run: tar -czf "leeroy-${GITHUB_REF_NAME}.tar.gz" patches modules config scripts README.md LICENSE

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "leeroy-${GITHUB_REF_NAME}.tar.gz" --generate-notes --verify-tag
