# The verification ledger: shipped features and the evidence that shows each one working live.
#
# `python -m leeroy_mind verify status [--json]` and the console's Ops panel "Verification" read
# this file and the live install read-only: bounded tails of the native logs and mind.log, and
# mind.db opened read-only. Nothing is ever written. A feature's status:
#   switched off  one of its switches is configured off (a native or Playerbots key unset in its
#                 .conf counts as its compiled default, `default` below);
#   failed        failure evidence, and nothing working seen after it;
#   seen working  working evidence, and no failure after it;
#   unverified    neither (`observed` evidence, such as an engage with no outcome or a death whose
#                 last hit names a spell, never changes this).
# Evidence older than `since` (when the change reached the live install, local time) is ignored.
# Counts are lower bounds: log budgets, rotation and retention drop old lines, while mind.db rows
# stay until something prunes them.
#
# [[feature]]: id, name, prs, since (optional), note (optional), then
#   [[feature.switch]]  source = "mind" (a `table.key` row of console/switches.py, whose default
#                       it takes), "native" (a Leeroy.* key) or "playerbots" (a Playerbots.* key);
#                       native and Playerbots keys come from console/native_switch_keys.py and
#                       name their compiled `default`. A feature mod-leeroy carries lists
#                       Leeroy.Enable too: the module's own switch stops all of them; offline
#                       raids, heroics, dummy trials and death-loop rescue also need
#                       Leeroy.KeepCast.
#   [[feature.evidence]] id, kind ("working", "failed" or "observed"), what (shown as is), and either
#     log = "server" | "playerbots" | "mind", token (a literal every matching line carries: the
#       scan's prefilter), pattern (a Python regex searched in the line after its timestamp; for
#       mind.log in the record read back as "event key=value ..."; a group named `code` is
#       tallied when it is a short identifier) and example (a synthetic line the tests match);
#     or db = { from, where, time, unit = "s" | "ms", code }: counts, first and last `time` of
#       `SELECT ... FROM <from> WHERE <where>`, grouped by the optional `code` expression. A pull's
#       outcome is timed by its end (tg_pull.end_ms, guild_raid.ended), when it became known.
# Only ids, counts, times, switch keys and short codes ever leave the ledger: never a log line,
# a name or any text a member or the owner wrote.

[[feature]]
id = "group_rez"
name = "Group resurrection: a rezzer with the mana walks in and rezzes"
prs = [276, 405]
since = "2026-11-21T10:10"
note = "Waits for combat, a fence, a pending answer or a soulstone are expected and not counted as failures."

[[feature.switch]]
source = "native"
key = "Leeroy.Enable"
default = true

[[feature.switch]]
source = "native"
key = "Leeroy.GroupRez.Enable"
default = true

[[feature.evidence]]
id = "cast"
kind = "working"
what = "a bot of his group cast its resurrection on a dead member (group_rez_cast)"
log = "server"
token = "group_rez_cast "
pattern = '^group_rez_cast guid=\d+ body=\d+ spell=\d+'
example = "2026-11-23 21:14:05 group_rez_cast guid=1649 body=1618 spell=20773"

[[feature.evidence]]
id = "blocked"
kind = "failed"
what = "a body left lying: no rezzer alive, in reach, with the mana or able to walk in (group_rez_blocked)"
log = "server"
token = "group_rez_blocked "
pattern = '^group_rez_blocked reason=(?P<code>no_caster|no_caster_in_range|all_oom|unreachable) dead=\d+ casters=\d+'
example = "2026-11-23 21:15:00 group_rez_blocked reason=all_oom dead=2 casters=1"

[[feature]]
id = "loot_handout"
name = "DKP loot hand-out reaches the winner and is charged"
prs = [406, 420]
since = "2026-11-21T12:26"

[[feature.switch]]
source = "native"
key = "Leeroy.Enable"
default = true

[[feature.evidence]]
id = "charged"
kind = "working"
what = "an item handed out in game and charged to the winner (dkp_ledger item rows)"
db = { from = "dkp_ledger", where = "reason = 'item'", time = "ts", unit = "s" }

[[feature.evidence]]
id = "give_unknown"
kind = "failed"
what = "the mind lost track of a give: no answer, a wrong one or no link (guild_loot_give_unknown; code: why)"
log = "mind"
token = "guild_loot_give_unknown "
pattern = '^guild_loot_give_unknown raid=\d+ item=\d+ to=\d+ command=\S+ attempt=\d+ code=(?P<code>[A-Za-z][A-Za-z0-9_]*)'
example = '{"ts": "2026-11-23T20:01:02.123-05:00", "level": "WARNING", "event": "log", "msg": "guild_loot_give_unknown raid=24 item=50274 to=1618 command=guild-loot-24-0123456789abcdef01234567 attempt=0 code=TimeoutError"}'

[[feature.evidence]]
id = "give_refused"
kind = "failed"
what = "the game refused a give or the item was gone (guild_loot_give_refused)"
log = "mind"
token = "guild_loot_give_refused "
pattern = '^guild_loot_give_refused raid=\d+ item=\d+ command=\S+ attempt=\d+ gone=(?:True|False)'
example = '{"ts": "2026-11-23T20:01:02.123-05:00", "level": "INFO", "event": "log", "msg": "guild_loot_give_refused raid=24 item=50274 command=guild-loot-24-0123456789abcdef01234567 attempt=1 gone=True"}'

[[feature.evidence]]
id = "unsettled"
kind = "observed"
what = "loot receipts still uncertain or refused (meta guild:loot; timed by the drop, so they never decide)"
db = { from = "meta", where = "key LIKE 'guild:loot:%' AND json_valid(value) AND json_extract(value, '$.state') IN ('uncertain', 'failed')", time = "json_extract(value, '$.received')", unit = "s", code = "coalesce(json_extract(value, '$.error'), json_extract(value, '$.state'))" }

