# Where the guild's members live: the fifty US states, the District of Columbia and the UK's
# nations and regions (geography/places.py reads it; geography/README.md says how).
#
# Plain, general facts only. The climate rows are typical daily highs and lows by month,
# January first, rounded from long-run normals for where most of the place's people live (a
# big state's other parts are colder, hotter, wetter or drier: `terrain` says so in words). A
# US place keeps them in Fahrenheit (highs, lows), a UK one in Celsius (highs_c, lows_c).
#
# zone       the IANA time zone where most of its people live
# point      [latitude, longitude] of where most of its people live: distances only, never shown
# coast      "ocean" (a sea coast), "lakes" (Great Lakes or a big lake shore, no sea) or "none"
# mountains  false only where nobody would call anything there a mountain
# humid      summers are humid
# snow       months snow can fall somewhere in the place (the guard's months: generous)
# events     seasonal things people there talk about, with their months
# notes      a season's weather in a few words (winter, spring, summer, autumn)

