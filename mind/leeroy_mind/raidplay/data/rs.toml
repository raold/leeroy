# Ruby Sanctum playbooks. Spell ids, timers and phases come from this server's boss scripts
# (script_dir), Spell.dbc and the core's SpellInfoCorrections; the explanations are our own words.
# Per-difficulty spell ids follow the core's spell difficulty table (SpellDifficulty.dbc; the world
# database adds no rows for these spells). Stock playerbots has a Ruby Sanctum strategy ("rs",
# playerbots_dir): fixed tank and raid spots, the two-spot meteor shuffle, combustion and consumption
# carried to fixed spots, the cutter dodge and the portal; its actions are named where they do a job.
# Server-side spells (spell_dbc: 74638 Meteor Strike Targeting, the 74680-74689 summons, 74696) are
# not in Spell.dbc, so each mechanic names the client spell nearest them.
map = 724
key = "rs"
difficulties = ["10", "25", "10h", "25h"]
script_dir = "src/server/scripts/Northrend/ChamberOfAspects/RubySanctum"
playerbots_dir = "src/Ai/Raid/RS"

