roles = ["tank", "healer", "melee", "ranged"]
spells = [74637]
hits = { "10" = [74648], "25" = [75877], "10h" = [75878], "25h" = [75879] }
handled_by = "partial"
playerbots = ["rs halion meteor", "rs halion tank position"]
handled_note = "stock moves non-tanks between two fixed spots after a meteor lands away from the tank's spot, and the tank only for one within 10 yards of it; nobody steps out of any other impact"
explain = "He marks a player's spot with a Meteor Strike that lands six seconds later and hits everyone within twelve yards; get out of the circle."
check = "rs.halion.check_avoid"
radius = 12
duration = 7
first = 20
every = 40
# 74637 (cast at the target by the server-side 74638) summons the mark (40029) at the target's spot;
# the mark's countdown (74641, held 6.5 s by its script) then casts the 12-yard impact (74648 and its
# difficulty versions; the 25-man heroic one also summons a Living Inferno). Answered at its cast,
# round its destination, until the impact; tanks are left to stock's tank spots.
respond_roles = ["healer", "melee", "ranged"]

