# Phases: phase 2 begins when Guardians' Shadow Novas have drained Sara (she takes damage from nothing else);
# phase 3 when the Brain of Yogg-Saron falls below 30%, and Yogg-Saron is then set to 30% health.
# Keepers: Freya, Hodir, Mimiron and Thorim help only when the raid spoke to them in the Observation Ring after
# beating them (PERSISTENT_DATA_WATCHERS_MASK); none helping is Alone in the Darkness, which this playbook
# assumes. What the keeper count changes in the script: on 25-man with fewer than four, Deafening Roar in phase 3;
# Yogg-Saron's loot mode; the "lights in the darkness" achievements. Each present keeper adds its own help instead
# (comments below): a raid-wide +10% damage aura plus Freya +20% healing taken, Hodir -20% damage taken, Mimiron
# +20% speed, Thorim +20% health; Freya's sanity wells, Hodir's saving Protective Gaze, Mimiron's Destabilization
# Matrix on tentacles, Thorim's Titanic Storm that kills weakened Immortal Guardians. Without them none of it.
# The brain room and the three visions are places on the same map in the same phase (nothing in the script sets
# a phase mask): about 85-90 yards below the main room (z about 236-265 and 240 against 325-330), reached by the
# portals' teleports. The responder's areas and spacing only bind bots on the caster's floor (8 yards of height).
# Stock "sara shadow resistance" and "yogg-saron shadow resistance" put up a paladin's Shadow Resistance Aura;
# the Yogg-Saron trigger is registered as "yogg-saron shadow resistance triggerr" (sic), so only Sara's fires.

