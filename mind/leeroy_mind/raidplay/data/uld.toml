# the world database's spelldifficulty_dbc, spell_script_names and conditions; the explanations are our own words.
# SpellDifficulty.dbc has no rows for these spells: every 25-man id below comes from spelldifficulty_dbc, or for a
# triggered spell from the trigger field of its 25-man parent in Spell.dbc. SpellInfoCorrections changes none of
