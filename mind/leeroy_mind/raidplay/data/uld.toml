# creature_template(_addon), smart_scripts and the core's SpellInfoCorrections; the 25-man ids follow the world
# database's spelldifficulty_dbc (Spell.dbc has no SpellDifficulty rows for these spells).
#
# Stock playerbots' "ulduar" strategy (src/Ai/Raid/Uld) for these three bosses:
# - "auriaya fall from floor action": a cheat. A bot below z 410 in her room is teleported to its master; it plays
#   no mechanic, so nothing below names it.
# - "hodir move snowpacked icicle": a real move. While Hodir casts Flash Freeze, every bot more than 5 yards (2D)
#   from the nearest Snowpacked Icicle Target (33174) walks onto it (MoveTo, normal priority, not forced).
# - "hodir biting cold jump": a cheat. Only with the raid cheat on, a bot with 2+ Biting Cold stacks while its master
#   has fewer simply has the aura removed (no jump, no move).
# - "hodir frost resistance action", "freya nature resistance action", "freya fire resistance action": a paladin's
#   resistance aura or a hunter's Aspect of the Wild only; no mechanic is played, so nothing below names them.
# - "freya move away nature bomb": a real move (FleePosition 13 yards, combat priority) from any Nature Bomb object
#   within 12 yards, for every bot.
# - "freya mark dps target action": a tank bot (an assist tank when the main tank is a real player) marks skull:
#   Eonar's Gift, else the Ancient Conservator, else the trio member with the most health, else the first Detonating
#   Lasher only while every member has more health than a Detonate (4900 / 7200); damage bots follow skull, their
#   default mark. It sets square on Freya.
# - "freya move to healing spore action": ranged bots (ranged damage dealers and healers) walk within 6 yards of the
#   nearest Healthy Spore while the Ancient Conservator lives (combat priority).
# None of these moves is a forced move, so the responder never has to yield to them.

