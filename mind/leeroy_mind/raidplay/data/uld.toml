explain = "Engineers rebuild the harpoon guns while she circles; a ranged player fires each gun as it comes up, and two hits, four on 25-man, chain her to the ground."
check = "none"
# Each built gun's controller fires its Harpoon Shot (triggering 62505 on her). Stock sends the ranged damage
# dealer nearest a ready gun to use it. Its "already fired" test looks for Harpoon Chain auras (49679-49684)
# this core never applies, so it relies on its own 5 s per-gun re-use timer and the gun's ready state.

