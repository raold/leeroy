# Ulduar playbooks. Spell ids, timers and phases come from this server's boss scripts (script_dir), Spell.dbc,
# the world database's spelldifficulty_dbc (Ulduar's client SpellDifficulty rows are empty, so the 25-man ids come
# from there) and the core's SpellInfoCorrections; the explanations are our own words. Ulduar has no heroic
# difficulty: each hard mode is a boss phase "hard_mode" named after what starts it. Stock playerbots has an
# Ulduar strategy (playerbots_dir) up to Yogg-Saron and nothing for Algalon; several of its actions are cheats
# (teleports, aura removal, killing adds) with the raid cheat on, said beside each mechanic it touches.
map = 603
key = "uld"
difficulties = ["10", "25"]
script_dir = "src/server/scripts/Northrend/Ulduar/Ulduar"
playerbots_dir = "src/Ai/Raid/Uld"

# Ulduar (603) bosses 0-2: Flame Leviathan, Ignis the Furnace Master, Razorscale. Spell ids, timers and
# phases come from this server's scripts (boss_flame_leviathan.cpp, boss_ignis.cpp, boss_razorscale.cpp),
# Spell.dbc, spell_cone, spelldifficulty_dbc and SpellInfoCorrections; the explanations are our own words.
# Stock playerbots' "ulduar" strategy (src/Ai/Raid/Uld) has vehicle play for the Leviathan, a handful of
# Razorscale actions and, for Ignis and Razorscale, only a paladin's Fire Resistance Aura (legitimate class
# play, no cheat: BossFireResistanceAction adds the paladin's own aura strategy and casts it).

[[boss]]
index = 0
name = "Flame Leviathan"
slug = "leviathan"
creatures = [33113, 34003]
script = "boss_flame_leviathan.cpp"
melee_behind = false
no_behind_since = 2
call = "leviathan: kite when pursued, shut him down, keep pyrite up"
lust = false
phase = [
  { id = "main", name = "Vehicle battle" },
  { id = "hard_mode", name = "Hard mode (towers left standing)" },
]
# A vehicle fight: the raid drives Salvaged Siege Engines, Demolishers and Choppers, and players thrown onto
# his back sit in his seats (33114), immune to Flame Vents (63847), Missile Barrage, Battering Ram, Hodir's
# Fury and Mimiron's Inferno (the seat's PassengerBoarded). The script has no berserk, and Bloodlust does
# nothing for vehicle abilities. The native responder skips bots on vehicles, so every movement mechanic here
# has area = "none". Stock boards bots only when their master already sits in a vehicle ("flame leviathan
# vehicle near"): melee take siege engines, everyone else demolishers, then the spare seats and choppers.
# Left out: Missile Barrage (62400, every 4 s on every vehicle; nothing the raid does answers it), the
# defense turrets' Searing Flame (62402) on the riders, and Napalm Shell (63666/65026: declared, never cast).

[[boss.mechanic]]
id = "uld.leviathan.pursued"
name = "Pursued"
kind = "kite"
roles = ["tank", "healer", "melee", "ranged"]
spells = [62374, 62376]
handled_by = "partial"
playerbots = ["flame leviathan vehicle"]
handled_note = "a bot driving the chased vehicle runs it from corner to corner away from him; bots board vehicles only once their real-player master sits in one"
explain = "He fixes on one siege engine or demolisher at a time and rams it when he catches it; its driver keeps it running away from him while everyone else keeps hitting him."
check = "none"
every = 31
# Pursued (62374) picks a player-driven siege engine or demolisher in the Formation Grounds, resets his
# threat and chases it with 10 million threat; it is recast every 31 s and at once when his victim dies.
# Within 15 yards of his victim each swing is a Battering Ram (62376: knockback, +50% damage taken for
# 20 s, stacking). Gathering Speed (62375, every 15 s, 20 stacks) makes him ever faster until a shutdown.

