# Algalon's 62301 / 64598 (instant, no target) force-casts 62293 and 62295 on 1 / 3 random enemies (players or
# pets) within 100 yards: 62293 summons the marker 33104 at that unit's feet for 10 s, 62295 the asteroid 33105. Algalon's
# JustSummoned gives the marker its visual (62300, cast by the marker on itself) and lifts the asteroid 35 yards;
# 4 s later the asteroid casts 62304 / 64597, a missile (45 / 40 yd/s) to the nearest marker (conditions), and
# 62311 / 64596 hit: 41438-43562 (10) / 53625-56375 (25) fire within 100 yards (SpellInfoCorrections), full
# inside 6 yards, 2/d of it from 6 to 10 yards and 1/d beyond (spell_algalon_cosmic_smash_damage), knockback
# within 6. Answered at the marker's own 62300, round the marker, which marks the impact point about 4.8 s
# ahead; radius 10 is where the script's falloff drops to a tenth; duration covers the fall. Algalon's own
# cast is not answered (it names no place). Not answered by the 33105 missile cast: under a second before impact.
# Caveat (from the code, unverified in game): the markers are summoned by the forced player (EffectForceCast
# passes no original caster), so Algalon's JustSummoned may never see them; if so, 62300 is never cast, the
# smash never falls and this rule never fires. No avoid check: its 100-yard falloff touches every player.

