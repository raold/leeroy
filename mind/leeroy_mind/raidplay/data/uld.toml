# 2 (10-man) or 4 (25-man) harpoon hits, sits stunned about 30 s, breathes, beats her wings and takes off.
# Stock's "razorscale grounded" gathers ranged and healers within 12 yards of the arena centre: its
# behind-the-boss branch waits for a landing spot (588, -166) that this core's landing point (585.4,
# -173.5) never matches, so it does not keep them out of her front.

[[boss.mechanic]]
id = "uld.razorscale.harpoons"
name = "Harpoon guns"
kind = "use_object"
