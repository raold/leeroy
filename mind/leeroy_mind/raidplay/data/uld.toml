# Algalon the Observer (Ulduar 603, BOSS_ALGALON 13). Spell ids, timers and numbers from
# boss_algalon_the_observer.cpp, Spell.dbc, SpellInfoCorrections and the world database (spelldifficulty_dbc,
# spell_linked_spell, conditions, creature spawns). Stock playerbots has nothing for Algalon: the Uld strategy
# (src/Ai/Raid/Uld) ends with Yogg-Saron, and no source file under src/ names Algalon or any of his spells, so
# every mechanic here is handled_by = "none". With stock alone the raid dies at the first Big Bang.
#
# Timers count from the end of his engage countdown: the script adds 26 s on the very first pull of the
# instance and 8.5 s on every later pull before anything below starts (introDelay in JustEngagedWith).
#
# Phases: two kinds of phase matter here. The fight's phases are below (stars, then worm holes at 20%).
# Separately, black holes, worm holes and the fifth Phase Punch put a player in phase 16 (SPELL_AURA_PHASE,
# misc 16) for 10 s; Algalon, his stars, constellations and Cosmic Smash markers stay in phase 1. Pets,
# totems and guardians follow their owner's phase (Unit::SetPhaseMask). The native responder never binds a
# bot that is in another phase than the caster, so a bot hidden in a black hole is never moved by it.
# Neither the hazard scan nor stock avoid aoe treats a black hole or worm hole as a hazard: their periodic
# triggers (62168, 65250) apply the phase aura, not school damage, so nothing pushes a bot out of one.

[[boss]]
index = 13
name = "Algalon the Observer"
slug = "algalon"
creatures = [32871, 33070]
script = "boss_algalon_the_observer.cpp"
enrage = 360
call = "algalon: black hole for big bang, swap at four punches"
phase = [
  { id = "stars", name = "Stars and constellations" },
  { id = "worm_holes", name = "Worm holes", hp_below = 20 },
]
# enrage: Berserk (47008) 360 s after the countdown; Ascend to the Heavens 480 s after it (see berserk).

[[boss.mechanic]]
id = "uld.algalon.big_bang"
name = "Big Bang"
kind = "stack"
roles = ["healer", "melee", "ranged"]
spells = { "10" = [64443], "25" = [64584] }
hits = { "10" = [64443], "25" = [64584] }
handled_by = "none"
explain = "Big Bang takes eight seconds and hits everyone he can see for over eighty thousand; be inside a black hole, or a worm hole after twenty percent, when it lands, then step back out."
check = "uld.algalon.check_avoid_big_bang"
radius = 6
cast = 8
first = 90
every = 90.5
# How it is survived in this core: 64443 (10) / 64584 (25) is an 8 s cast whose effect 0 hits every enemy unit
# of the map (TARGET_UNIT_SRC_AREA_ENEMY, radius 50000) for 76313-88687 (10) or 107250-112750 (25) physical.
# It pierces immunities (SPELL_ATTR0_NO_IMMUNITIES) but lacks SPELL_ATTR6_IGNORE_PHASE_SHIFT, so
# SpellInfo::CheckTarget drops any unit Algalon cannot see: a player in phase 16. A Black Hole (32953) or,
# below 20%, a Worm Hole (34099) applies 62168 / 65250 every second to players within 6 yards: phase 16 and a
# screen effect for 10 s, plus (spell_linked_spell) 62169, 1532-1968 arcane damage a second for 10 s. So a
# player within 6 yards of a hole when the cast ends takes nothing, and one who left it in the last ~10 s is
# still phased. Big Bang's effect 1 then triggers 64445 (IGNORE_PHASE_SHIFT, whole map), whose first tick a
# second later strips every phase aura and 62169 from everyone; a player still inside is phased again at the
# next tick and can neither hit Algalon nor stop the damage, so step out of the hole after the cast.
# Inside the hole's phase, eight Dark Matter (33089, phase-16 spawns, two at each star spot, wandering 20 yd,
# hostile melee) can attack. The cast has no target or destination, so the responder cannot answer it (its
# stack gathers round a cast's target); positional is not a responded kind. Algalon stands still from the cast
# start until 3 s after it lands, and his melee, Quantum Strike, Phase Punch and Cosmic Smash wait 11 s.

# Answered: at the cast start (an 8 s cast) every healer, melee and ranged bot gathers within the 6 yards of the
# Black Hole or Worm Hole nearest it (area "nearest", within 40 yards; tanks stay out: Big Bang must find a
# target, see big_bang_target), whatever phase it is in once inside; the gathering ends with the cast.
area = "nearest"
anchors = [32953, 34099]
duration = 0.5

