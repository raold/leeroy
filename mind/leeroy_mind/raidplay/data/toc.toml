# Trial of the Crusader playbooks. Spell ids, timers and phases come from this server's boss
# scripts (script_dir); the explanations are our own words. Playerbots has no Trial of the
# Crusader raid strategy, so nothing here is handled by its stock scripts. Checks with
# since = 1 are the training ground's original rows.
