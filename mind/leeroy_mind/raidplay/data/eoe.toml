handled_note = "stock holds the main tank at a fixed spot north of the centre and gathers everyone else but hunters at the centre, behind him; nobody steps out of his front as he turns"
explain = "He breathes arcane in a cone at his tank, and five seconds later each player it hit bursts on everyone within ten yards; only the tank faces him, and the tank stands alone."
