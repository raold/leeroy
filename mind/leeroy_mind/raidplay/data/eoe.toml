# Eye of Eternity playbooks. Spell ids, timers and phases come from this server's boss script (script_dir),
# Spell.dbc and the world database's spelldifficulty_dbc; the explanations are our own words. Stock playerbots
# has an Eye of Eternity strategy (playerbots_dir, `wotlk-eoe`): fixed spots in phase 1, targets in phase 2 and
# drake abilities in phase 3. Phase 3 is fought on drakes (vehicles), which the native responder never moves.
map = 616
key = "eoe"
difficulties = ["10", "25"]
script_dir = "src/server/scripts/Northrend/Nexus/EyeOfEternity"
playerbots_dir = "src/Ai/Raid/EoE"

# Eye of Eternity: Malygos (map 616, boss index 0). Spell ids, timers and phases come from this server's
# boss_malygos.cpp, eye_of_eternity.h and instance_eye_of_eternity.cpp, Spell.dbc, spell_cone and the
# core's SpellInfoCorrections; the explanations are our own words. Only three spells have spell
# difficulty rows (spelldifficulty_dbc: Arcane Breath 56272/60072, Arcane Storm 61693/61694, the
# phase-3 Surge of Power 57407/60936); every other spell is the same id on 10 and 25.
#
# Stock playerbots ("wotlk-eoe", src/Ai/Raid/EoE) judges the phase per bot: 3 while it rides a Wyrmrest
# Skytalon, else 1 above 50 percent and 2 at or below it.
# - Phase 1 ("malygos position", ACTION_MOVE, MOVEMENT_COMBAT, not forced): the main tank goes to a fixed
#   spot 36 yards north of the centre (757, 1337); everyone else but hunters gathers within 15 yards of
#   the centre (755, 1301), but stops gathering them while a Power Spark is alive. "malygos target" points every
#   non-healer at Malygos (its spark targeting and the death grip pull are commented out). MalygosMultiplier
#   switches off follow, damage assist, ranged target dropping and assist for tanks other than the main.
# - Phase 2: "malygos target" points ranged damage dealers at a Scion and every other non-healer at a
#   Nexus Lord; the multiplier switches off damage assist, flee and tank assist onto a Scion. Nobody rides
#   a disc or uses a bubble.
# - Phase 3: every movement action but "eoe fly drake" is switched off. That keeps a bot's drake in a ring
#   3 yards round its master's drake, only while the master rides one (its boss-distance branch is dead
#   code, `boss && false`). "eoe drake attack" sorts the group by GUID: the first five (eleven on 25-man),
#   whatever their role, Revivify their own drake and Life Burst at five combo points; the rest Flame Spike
#   and Engulf in Flames at two. It never casts Flame Shield or Blazing Speed.
# - The "power spark" trigger is registered but no strategy uses it.
# - Opt-in local playerbots patch 0014 (Playerbots.RaidVehicleSupport = 1) replaces the phase-3
#   driver with master-independent safe-ring flight, role-aware drake healers and energy/combo-aware
#   damage/healing/Surge shields. It defaults off; the coverage declarations below describe stock.
# Phase 3 is fought on drakes: bots on a vehicle are outside the native responder, so none of its
# mechanics are answered by moving bodies (area = "none"). Vortex also seats every player on a vehicle.

[[boss]]
index = 0
name = "Malygos"
slug = "malygos"
creatures = [28859, 31734]
script = "boss_malygos.cpp"
enrage = 600
# The last phase is a vehicle fight (melee ride drakes) and in phase 2 he cannot be attacked at all.
melee_behind = false
no_behind_since = 2
call = "malygos: kill sparks, bubbles on deep breath, shield surges"
phase = [
  { id = "platform", name = "Phase 1: on the platform" },
  { id = "discs", name = "Phase 2: the disc riders", hp_below = 50 },
  { id = "drakes", name = "Phase 3: on the drakes" },
]
# Phase 2 starts at 50 percent (DamageTaken, never during a Vortex): he flies to the centre, rises, and
# 22.5 s later moves out to his circle and sends the disc riders; he cannot be attacked until phase 3.
# Phase 3 starts when every Nexus Lord and Scion is dead (checked every 3 s), not at a health mark.

